<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | FLORA Moda Fitness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .catalogo-wrapper {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 2rem;
            padding: 2rem;
        }

        .filters-sidebar {
            background-color: var(--cor-fundo-light);
            padding: 1.5rem;
            border-radius: 0.5rem;
            height: fit-content;
        }

        .filter-group {
            margin-bottom: 2rem;
        }

        .filter-group h4 {
            margin-bottom: 1rem;
            font-size: 1rem;
        }

        .filter-group label {
            display: block;
            margin-bottom: 0.75rem;
            cursor: pointer;
        }

        .filter-group input {
            margin-right: 0.5rem;
            cursor: pointer;
        }

        .catalogo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .catalogo-header select {
            padding: 0.75rem;
            border: 1px solid var(--cor-borda);
            border-radius: 0.5rem;
            font-family: var(--font-corpo);
        }

        @media (max-width: 768px) {
            .catalogo-wrapper {
                grid-template-columns: 1fr;
            }

            .filters-sidebar {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- HEADER (Reutilizado da index.html) -->
    <header class="header">
        <!-- ... Mesmo código do header da index.html ... -->
    </header>

    <!-- BREADCRUMB -->
    <div style="padding: 1rem 2rem; background-color: var(--cor-fundo-light); border-bottom: 1px solid var(--cor-borda);">
        <div class="container" style="font-size: 0.875rem;">
            <a href="../index.html">Home</a> / <span>Catálogo</span>
        </div>
    </div>

    <!-- CONTEÚDO CATÁLOGO -->
    <main class="container">
        <div class="catalogo-wrapper">
            <!-- FILTROS -->
            <aside class="filters-sidebar">
                <h3>Filtrar</h3>
                
                <div class="filter-group">
                    <h4>Categorias</h4>
                    <label><input type="checkbox"> Leggings & Calças</label>
                    <label><input type="checkbox"> Tops & Blusas</label>
                    <label><input type="checkbox"> Shorts & Bermudas</label>
                    <label><input type="checkbox"> Sutiãs Esportivos</label>
                </div>

                <div class="filter-group">
                    <h4>Preço</h4>
                    <label><input type="checkbox"> Até R$ 100</label>
                    <label><input type="checkbox"> R$ 100 - R$ 150</label>
                    <label><input type="checkbox"> R$ 150 - R$ 200</label>
                    <label><input type="checkbox"> Acima de R$ 200</label>
                </div>

                <div class="filter-group">
                    <h4>Tamanho</h4>
                    <label><input type="checkbox"> XS</label>
                    <label><input type="checkbox"> S</label>
                    <label><input type="checkbox"> M</label>
                    <label><input type="checkbox"> L</label>
                    <label><input type="checkbox"> XL</label>
                </div>

                <button class="btn btn-primary btn-full">Aplicar Filtros</button>
            </aside>

            <!-- PRODUTOS -->
            <section>
                <div class="catalogo-header">
                    <h2>Todos os Produtos</h2>
                    <select>
                        <option>Ordenar por</option>
                        <option>Mais Recentes</option>
                        <option>Menor Preço</option>
                        <option>Maior Preço</option>
                        <option>Mais Vendidos</option>
                    </select>
                </div>

                <div class="produtos-grid">
                    <!-- Reutilizar cards de produtos da index.html × 12 -->
                    <!-- (Copiar e multiplicar os 4 produtos anteriores 3 vezes) -->
                </div>

                <!-- PAGINAÇÃO -->
                <div style="text-align: center; margin-top: 3rem; display: flex; gap: 1rem; justify-content: center;">
                    <button class="btn btn-primary">1</button>
                    <button class="btn btn-outline">2</button>
                    <button class="btn btn-outline">3</button>
                    <button class="btn btn-outline">Próxima →</button>
                </div>
            </section>
        </div>
    </main>

    <!-- FOOTER (Reutilizado) -->
    <footer class="footer">
        <!-- ... Mesmo código do footer da index.html ... -->
    </footer>

    <script src="../js/app.js"></script>
</body>
</html>
